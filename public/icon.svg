<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- agentmobile brand icon: terminal brackets + signal waveform + prompt -->
  <defs>
    <linearGradient id="amGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  <rect width="64" height="64" rx="14" fill="none" stroke="#334155" stroke-width="1.5" />
  <!-- Left bracket [ -->
  <path d="M22 16 L14 16 L14 48 L22 48" fill="none" stroke="url(#amGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right bracket ] -->
  <path d="M42 16 L50 16 L50 48 L42 48" fill="none" stroke="url(#amGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Signal waveform: 3 ascending bars -->
  <line x1="26" y1="38" x2="26" y2="42" stroke="url(#amGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="32" x2="32" y2="42" stroke="url(#amGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="38" y1="26" x2="38" y2="42" stroke="url(#amGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Prompt caret at bottom-right -->
  <polyline points="44,50 50,50 50,50" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M46 48 L52 48" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
</svg>
